volumes:
  pg_data:

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/martin}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./sql:/workspace/sql:ro
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:1.6.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARTIN_DATABASE_URL: ${MARTIN_DATABASE_URL:-postgres://postgres:postgres@db:5432/martin}
    command: ["--config", "/config.yaml"]
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    volumes:
      - ./martin/config.yaml:/config.yaml:ro
      - ./martin/styles:/styles:ro
