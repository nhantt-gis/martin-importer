[project]
name = "martin-importer"
version = "0.1.0"
description = "Migration, and import service for Martin-backed admin boundaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "typer>=0.16.1",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
martin-importer = "martin_importer.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martin_importer"]